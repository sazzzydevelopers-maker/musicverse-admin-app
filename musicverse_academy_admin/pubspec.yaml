name: musicverse_academy_admin
description: Production-Ready Admin App for MusicVerse Academy.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
 firebase_core: ^3.8.1
 firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.8.4
  provider: ^6.1.2
  flutter_riverpod: ^2.3.0
 go_router: ^14.6.2
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.0.2
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

sets:
    - assets/images/
    - assets/icons/